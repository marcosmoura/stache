[package]
name = "stache-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stache SDK foundation"
readme = "../../../README.md"
keywords = ["stache", "sdk"]
categories = ["development-tools"]

[features]
# Exposes input fakes (`input::testing`) to other crates' tests.
testing = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
notify-debouncer-full = "0.7.0"
rustix = { version = "1.1.6", features = ["fs", "process"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
toml = "1.2.0"
toml_edit = { version = "0.25.18", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

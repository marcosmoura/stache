[package]
name = "stache-proxy-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stache proxyAudio policy, runtime, CLI and read-only IPC"
readme = "../../../../README.md"
keywords = ["stache", "audio", "configuration"]
categories = ["config"]

[dependencies]
clap = "4.6.7"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
stache-macos = { path = "../../macos" }
stache-sdk = { path = "../../sdk" }

[lints]
workspace = true

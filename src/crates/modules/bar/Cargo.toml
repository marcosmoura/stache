[package]
name = "stache-bar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stache Bar configuration and panel runtime"
readme = "../../../../README.md"
keywords = ["stache", "bar", "configuration"]
categories = ["config"]

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
dotenvy = "=0.15.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
libc = "0.2.191"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
stache-macos = { path = "../../macos" }
stache-sdk = { path = "../../sdk" }

[dev-dependencies]
stache-macos = { path = "../../macos", features = ["testing"] }
stache-sdk = { path = "../../sdk", features = ["testing"] }
tempfile = "=3.27.0"

[lints]
workspace = true

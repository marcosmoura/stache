[package]
name = "stache-tiling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stache tiling configuration"
readme = "../../../../README.md"
keywords = ["stache", "tiling", "configuration"]
categories = ["config"]

[features]
testing = ["stache-macos/testing"]

[dependencies]
clap = "4.6.7"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
stache-macos = { path = "../../macos" }
stache-sdk = { path = "../../sdk" }
unicode-width = "0.2.3"

[dev-dependencies]
stache-cli = { path = "../../cli" }
stache-macos = { path = "../../macos", features = ["testing"] }
stache-sdk = { path = "../../sdk", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true

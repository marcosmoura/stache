[package]
name = "stache-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stache native adapter foundation"
readme = "../../../README.md"
keywords = ["stache", "macos"]
categories = ["os::macos-apis"]

[features]
test = []
testing = []

[dependencies]
block2 = "0.6.2"
core-foundation = "0.10"
core-graphics = { version = "0.25.0", default-features = false }
keyboard-types.workspace = true
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSAppearance", "NSAnimation", "NSAnimationContext", "NSApplication", "NSColor", "NSControl", "NSEvent", "NSFont", "NSAttributedString", "NSCell", "NSGraphics", "NSMenu", "NSMenuItem", "NSPanel", "NSParagraphStyle", "NSResponder", "NSRunningApplication", "NSScreen", "NSStatusBar", "NSText", "NSTextField", "NSTrackingArea", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core", "std"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["AudioHardware", "std"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["CoreAudioBaseTypes", "std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFBase", "CFDate", "CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFString", "block2", "std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGEvent", "CGEventTypes", "CGImage", "CGPath", "CGSession", "std"] }
objc2-core-location = { version = "0.3.2", default-features = false, features = ["CLLocation", "CLLocationManager", "CLLocationManagerDelegate", "block2", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSBundle", "NSDate", "NSDictionary", "NSDistributedNotificationCenter", "NSError", "NSNotification", "NSObject", "NSOperation", "NSProcessInfo", "NSString", "NSTimer", "NSURL", "NSUserDefaults", "block2", "std"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["pwr_mgt", "std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CAAnimation", "CABase", "CAGradientLayer", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stache-sdk = { path = "../sdk" }
starship-battery = { version = "=0.11.1", default-features = false }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen", "objc2-core-graphics"] }
tempfile = "3.27.0"

[[test]]
name = "desktop_main_thread"
harness = false

[lints]
workspace = true

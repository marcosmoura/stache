[package]
name = "stache-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stache native adapter foundation"
readme = "../../../README.md"
keywords = ["stache", "macos"]
categories = ["os::macos-apis"]

[features]
test = []
testing = []

[dependencies]
block2 = "0.6.2"
core-foundation = "0.10"
core-graphics = { version = "0.25.0", default-features = false }
keyboard-types.workspace = true
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSScreen", "NSWorkspace", "block2", "objc2-core-foundation", "objc2-core-graphics", "std"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["AudioHardware", "std"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["CoreAudioBaseTypes", "std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFBase", "CFDate", "CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFString", "std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGEvent", "CGEventTypes", "CGSession", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSBundle", "NSDate", "NSDictionary", "NSDistributedNotificationCenter", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "NSTimer", "NSURL", "block2", "std"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["pwr_mgt", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stache-sdk = { path = "../sdk" }

[dev-dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen", "objc2-core-graphics"] }
tempfile = "3.27.0"

[[test]]
name = "desktop_main_thread"
harness = false

[lints]
workspace = true

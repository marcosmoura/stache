[package]
name = "stache-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stache Next tray-only desktop foundation"
readme = "../../../README.md"
keywords = ["stache", "tauri", "macos"]
categories = ["gui"]
default-run = "stache"

[[bin]]
name = "stache"
path = "src/main.rs"

[[bin]]
name = "stache-smoke"
path = "src/bin/smoke.rs"
required-features = ["smoke"]

[[bin]]
name = "generate-schema"
path = "src/bin/generate-schema.rs"
required-features = ["dev-tools"]

[[bin]]
name = "generate-bindings"
path = "src/bin/generate-bindings.rs"
required-features = ["dev-tools"]

[[bin]]
name = "menu-native-check"
path = "src/bin/menu-native-check.rs"
required-features = ["menu-native-check"]

[features]
custom-protocol = ["tauri/custom-protocol"]
dev-tools = []
menu-native-check = []
smoke = ["custom-protocol", "stache-macos/test"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
stache-bar = { path = "../modules/bar" }
stache-cli = { path = "../cli" }
stache-hold-to-quit = { path = "../modules/hold-to-quit" }
stache-keep-awake = { path = "../modules/keep-awake" }
stache-keybindings = { path = "../modules/keybindings" }
stache-macos = { path = "../macos" }
stache-menu-anywhere = { path = "../modules/menu-anywhere" }
stache-notunes = { path = "../modules/notunes" }
stache-proxy-audio = { path = "../modules/proxy-audio" }
stache-sdk = { path = "../sdk" }
stache-tiling = { path = "../modules/tiling" }
stache-wallpapers = { path = "../modules/wallpapers" }
tauri = { version = "=2.12.5", default-features = false, features = ["macos-private-api", "specta", "tray-icon", "wry"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
schemars = "1.2.3"
stache-hold-to-quit = { path = "../modules/hold-to-quit", features = ["testing"] }
stache-keybindings = { path = "../modules/keybindings", features = ["testing"] }
stache-macos = { path = "../macos", features = ["testing"] }
stache-menu-anywhere = { path = "../modules/menu-anywhere", features = ["testing"] }
stache-tiling = { path = "../modules/tiling", features = ["testing"] }

[lints]
workspace = true

name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Foundation (macOS 26)
    runs-on: macos-26
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
      - name: Retained nightly toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-sort@2.1.4,cargo-nextest@0.9.151,cargo-audit@0.22.2
      - name: Lockfile matches manifests
        run: cargo fetch --locked
      - run: bun install --frozen-lockfile
      - name: Vendored media adapter matches the pinned bottle
        run: bun run vendor:media-control -- --verify-upstream
      - run: node_modules/.bin/playwright install webkit
      - name: Generated artifacts drift
        run: bun run check:generated
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:ui:coverage
      - name: Audit new locks only
        run: |
          bun audit
          cargo audit --target-os macos
      - run: bun run build
      - run: bun run tauri:build
      - name: Lockfiles unchanged
        run: git diff --exit-code -- Cargo.lock bun.lock

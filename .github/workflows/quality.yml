name: Quality

on:
  push:
    branches: [main]
    tags: ['v*-rc.*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Foundation (macOS 26)
    runs-on: macos-26
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Retained nightly toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort,cargo-nextest,cargo-audit
      - run: bun install --frozen-lockfile
      - run: node_modules/.bin/playwright install webkit
      - name: Generated artifacts drift
        run: bun run check:generated
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:ui:coverage
      - name: Audit new locks only
        run: |
          bun audit
          cargo audit --target-os macos
      - run: bun run build
      - run: bun run tauri:build
      - run: bun run release
      - name: Verify release checksums
        working-directory: target/release-artifacts
        run: shasum -a 256 -c SHA256SUMS

cargo-features = ["profile-rustflags", "trim-paths"]

[workspace]
resolver = "2"
members = [
    "src/crates/app",
    "src/crates/cli",
    "src/crates/macos",
    "src/crates/modules/bar",
    "src/crates/modules/hold-to-quit",
    "src/crates/modules/keep-awake",
    "src/crates/modules/keybindings",
    "src/crates/modules/menu-anywhere",
    "src/crates/modules/notunes",
    "src/crates/modules/proxy-audio",
    "src/crates/modules/wallpapers",
    "src/crates/sdk",
]
exclude = ["_legacy"]

[workspace.package]
version = "0.25.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/marcosmoura/stache"

[workspace.dependencies]
# Parser only (`HotKey`, `Modifiers`, `Code`); never its native manager.
global-hotkey = { version = "0.8.0", default-features = false }
# The `Code` type shared by the parser and the native key table.
keyboard-types = { version = "0.7.0", default-features = false }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
# These new nightly diagnostics have invalid automatic fixes for generic test values.
assert_is_empty = "allow"
suboptimal_flops = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
rustflags = ["-Cdebuginfo=0"]
strip = true
trim-paths = "all"

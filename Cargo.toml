cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = [
    "src/crates/app",
    "src/crates/cli",
    "src/crates/macos",
    "src/crates/modules/bar",
    "src/crates/modules/hold-to-quit",
    "src/crates/modules/keep-awake",
    "src/crates/modules/keybindings",
    "src/crates/modules/menu-anywhere",
    "src/crates/modules/notunes",
    "src/crates/modules/proxy-audio",
    "src/crates/modules/tiling",
    "src/crates/modules/wallpapers",
    "src/crates/sdk",
]

[workspace.package]
version = "0.26.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/marcosmoura/stache"

[workspace.dependencies]
# Parser only (`HotKey`, `Modifiers`, `Code`); never its native manager.
global-hotkey = { version = "0.10.0", default-features = false }
# The `Code` type shared by the parser and the native key table.
keyboard-types = { version = "0.8.3", default-features = false }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
# These new nightly diagnostics have invalid automatic fixes for generic test values.
assert_is_empty = "allow"
suboptimal_flops = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
rustflags = ["-Cdebuginfo=0"]
strip = true
trim-paths = "all"

# The wallpaper cold path (decode, resize, blur, PNG encode, hashing) builds at
# opt-level 3; everything else stays size-optimised. `stache-wallpapers` is in
# the list because the generic encode path is monomorphised in that crate.
[profile.release.package.stache-wallpapers]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.fast_image_resize]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.simd-adler32]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3
